[package]
name = "seizethemana"
version = "0.1.0"
edition = "2024"
description = "Scryfall-backed MTG card search, collection (binder) manager, and deck tooling for humans and coding agents"
readme = "README.md"
license = "MIT"
authors = ["Zack Corr <zack@z0w0.me>"]
repository = "https://github.com/z0w0/seizethemana"
keywords = ["magic-the-gathering", "mtg", "scryfall", "cli", "manabox"]
categories = ["command-line-utilities"]
rust-version = "1.88"

# The CLI is `stm` everywhere (cargo install, binstall, docs); the crate
# keeps the project name.
[[bin]]
name = "stm"
path = "src/main.rs"

# cargo-binstall support: prebuilt release archives from GitHub releases.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
pkg-fmt = "txz"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
csv = "1.3"
dialoguer = { version = "0.12.0", default-features = false, features = ["fuzzy-select"] }
fastembed = { version = "6.0.3", default-features = false, features = [
  "hf-hub-rustls-tls",
  "ort-download-binaries-rustls-tls",
  "image-models",
] }
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "rustls-tls"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["coreml"] }
tokenizers = "0.23"
flate2 = "1.1"
indicatif = "0.18"
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
memmap2 = "0.9"
owo-colors = "4.2"
rand = "0.9"
rand_chacha = "0.9"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
rusqlite = { version = "0.38", features = ["bundled"] }
rusqlite_migration = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "query_bench"
harness = false

[profile.release]
lto = true
strip = true
